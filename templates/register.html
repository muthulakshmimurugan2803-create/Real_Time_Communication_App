{% extends "base.html" %}
{% block title %}Register - Real-Time Communication App{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">RC</div>
      <span class="brand-name">Real-Time Communication</span>
    </div>

    <h1 class="auth-title">Create an account</h1>
    <p class="auth-subtitle">Just a username and password — nothing else</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('main.register') }}" class="auth-form" id="register-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus minlength="3" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Choose a password" required minlength="4" autocomplete="new-password">

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="4" autocomplete="new-password">

      <div class="field-error" id="confirm-error"></div>

      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('main.login') }}">Log in</a></p>
  </div>
</div>

<script>
  // Client-side check so users get instant feedback before the form is
  // even submitted. The server re-validates this too, since client-side
  // checks can always be bypassed.
  document.getElementById("register-form").addEventListener("submit", function (e) {
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm_password").value;
    var errorBox = document.getElementById("confirm-error");

    if (password !== confirm) {
      e.preventDefault();
      errorBox.textContent = "Passwords do not match.";
    } else {
      errorBox.textContent = "";
    }
  });
</script>
{% endblock %}
